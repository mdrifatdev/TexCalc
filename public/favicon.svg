  <!-- Winding threads -->
  <path d="M10 12.5 C 13 11, 19 14, 22 12.5" stroke="url(#grad)" stroke-width="1.5" stroke-linecap="round" fill="none" />
  <path d="M10 14.5 C 13 13, 19 16, 22 14.5" stroke="url(#grad)" stroke-width="1.5" stroke-linecap="round" fill="none" />
  <path d="M10 16.5 C 13 15, 19 18, 22 16.5" stroke="url(#grad)" stroke-width="1.5" stroke-linecap="round" fill="none" />
  <path d="M10 18.5 C 13 17, 19 20, 22 18.5" stroke="url(#grad)" stroke-width="1.5" stroke-linecap="round" fill="none" />
  <!-- Crossing calculation thread lines -->
  <line x1="7" y1="23" x2="25" y2="5" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.8" />
  <line x1="7" y1="5" x2="25" y2="23" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.8" />
</svg>